
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sửa sản phẩm - MENSTYLE</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
</head>

<body class="bg-light">

    <div class="container py-5">

        <h1 class="mb-4">Sửa sản phẩm</h1>

        <form
            action="{{ url_for('admin.edit_product', product_id=product.id) }}"
            method="POST"
            class="card card-body shadow-sm"
        >

            <div class="mb-3">
                <label class="form-label">Tên sản phẩm</label>

                <input
                    type="text"
                    name="name"
                    class="form-control"
                    value="{{ product.name }}"
                    required
                >
            </div>

            <div class="mb-3">
                <label class="form-label">Danh mục</label>

                <input
                    type="text"
                    name="category"
                    class="form-control"
                    value="{{ product.category }}"
                    required
                >
            </div>

            <div class="mb-3">
                <label class="form-label">Giá gốc</label>

                <input
                    type="number"
                    name="price"
                    class="form-control"
                    value="{{ product.price }}"
                    min="0"
                    required
                >
            </div>

            <div class="mb-3">
                <label class="form-label">Giá khuyến mãi</label>

                <input
                    type="number"
                    name="sale_price"
                    class="form-control"
                    value="{{ product.sale_price or 0 }}"
                    min="0"
                >
            </div>

            <div class="mb-3">
                <label class="form-label">Đường dẫn hình ảnh</label>

                <input
                    type="text"
                    name="image"
                    class="form-control"
                    value="{{ product.image or '' }}"
                >
            </div>

            <div class="mb-3">
                <label class="form-label">Mô tả</label>

                <textarea
                    name="description"
                    class="form-control"
                    rows="4"
                >{{ product.description or '' }}</textarea>
            </div>

            <div class="mb-3">
                <label class="form-label">Chất liệu</label>

                <input
                    type="text"
                    name="material"
                    class="form-control"
                    value="{{ product.material or '' }}"
                >
            </div>

            <div class="mb-3">
                <label class="form-label">Kích thước</label>

                <input
                    type="text"
                    name="sizes"
                    class="form-control"
                    value="{{ product.sizes or '' }}"
                >
            </div>

            <div class="mb-3">
                <label class="form-label">Màu sắc</label>

                <input
                    type="text"
                    name="colors"
                    class="form-control"
                    value="{{ product.colors or '' }}"
                >
            </div>

            <div class="mb-3">
                <label class="form-label">Số lượng tồn kho</label>

                <input
                    type="number"
                    name="stock"
                    class="form-control"
                    value="{{ product.stock }}"
                    min="0"
                    required
                >
            </div>

            <div class="d-flex gap-2">

                <button
                    type="submit"
                    class="btn btn-primary"
                >
                    Cập nhật sản phẩm
                </button>

                <a
                    href="{{ url_for('admin.admin_products') }}"
                    class="btn btn-secondary"
                >
                    Quay lại
                </a>

            </div>

        </form>

    </div>

</body>
</html>
