
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Thêm sản phẩm - MENSTYLE</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
</head>

<body class="bg-light">

    <div class="container py-5">

        <h1 class="mb-4">Thêm sản phẩm mới</h1>

        <form
            action="{{ url_for('admin.add_product') }}"
            method="POST"
            class="card card-body shadow-sm"
        >

            <div class="mb-3">
                <label class="form-label">Tên sản phẩm</label>

                <input
                    type="text"
                    name="name"
                    class="form-control"
                    required
                >
            </div>

            <div class="mb-3">
                <label class="form-label">Danh mục</label>

                <input
                    type="text"
                    name="category"
                    class="form-control"
                    placeholder="Ví dụ: Áo thun"
                    required
                >
            </div>

            <div class="mb-3">
                <label class="form-label">Giá gốc</label>

                <input
                    type="number"
                    name="price"
                    class="form-control"
                    min="0"
                    required
                >
            </div>

            <div class="mb-3">
                <label class="form-label">Giá khuyến mãi</label>

                <input
                    type="number"
                    name="sale_price"
                    class="form-control"
                    min="0"
                >
            </div>

            <div class="mb-3">
                <label class="form-label">Đường dẫn hình ảnh</label>

                <input
                    type="text"
                    name="image"
                    class="form-control"
                    placeholder="images/products/ao-thun-den.jpg"
                >
            </div>

            <div class="mb-3">
                <label class="form-label">Mô tả</label>

                <textarea
                    name="description"
                    class="form-control"
                    rows="4"
                ></textarea>
            </div>

            <div class="mb-3">
                <label class="form-label">Chất liệu</label>

                <input
                    type="text"
                    name="material"
                    class="form-control"
                    placeholder="Ví dụ: Cotton"
                >
            </div>

            <div class="mb-3">
                <label class="form-label">
                    Kích thước
                </label>

                <input
                    type="text"
                    name="sizes"
                    class="form-control"
                    placeholder="S,M,L,XL,XXL"
                >
            </div>

            <div class="mb-3">
                <label class="form-label">
                    Màu sắc
                </label>

                <input
                    type="text"
                    name="colors"
                    class="form-control"
                    placeholder="Đen,Trắng,Xanh"
                >
            </div>

            <div class="mb-3">
                <label class="form-label">Số lượng tồn kho</label>

                <input
                    type="number"
                    name="stock"
                    class="form-control"
                    min="0"
                    value="0"
                    required
                >
            </div>

            <div class="d-flex gap-2">

                <button
                    type="submit"
                    class="btn btn-success"
                >
                    Lưu sản phẩm
                </button>

                <a
                    href="{{ url_for('admin.admin_products') }}"
                    class="btn btn-secondary"
                >
                    Quay lại
                </a>

            </div>

        </form>

    </div>

</body>
</html>
